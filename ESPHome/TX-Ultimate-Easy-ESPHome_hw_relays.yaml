#####                              TX Ultimate Easy for ESPHome                                #####
#####                  Repository: https://github.com/GuyZipory/TX-Ultimate-Easy               #####
####################################################################################################
##### Purpose: ESPHome - Hardware - Relays                                                     #####
####################################################################################################
##### Author: edwardtfn - https://github.com/edwardtfn - https://buymeacoffee.com/edwardfirmo  #####
##### Fork maintained by: GuyZipory - https://github.com/GuyZipory                             #####
####################################################################################################
##### NOTE:                                                                                    #####
##### - Make changes ONLY if absolutely necessary and you have the required knowledge.         #####
##### - For normal system use, modifications to this file are NOT required.                    #####
####################################################################################################
---
substitutions:
  expose_relays_leds_to_ha: false

  relay_1_mode: switch  # 'switch', 'light', or 'disabled'
  relay_2_mode: switch  # 'switch', 'light', or 'disabled'
  relay_3_mode: switch  # 'switch', 'light', or 'disabled'
  relay_4_mode: switch  # 'switch', 'light', or 'disabled'

  RELAY_1_MODE_LOWER: ${ relay_1_mode | lower }
  RELAY_2_MODE_LOWER: ${ relay_2_mode | lower }
  RELAY_3_MODE_LOWER: ${ relay_3_mode | lower }
  RELAY_4_MODE_LOWER: ${ relay_4_mode | lower }

  SL_RELAY_1_MODE: ${ 1 if RELAY_1_MODE_LOWER == "switch" else (2 if RELAY_1_MODE_LOWER == "light" else 0) }
  SL_RELAY_2_MODE: ${ 1 if RELAY_2_MODE_LOWER == "switch" else (2 if RELAY_2_MODE_LOWER == "light" else 0) }
  SL_RELAY_3_MODE: ${ 1 if RELAY_3_MODE_LOWER == "switch" else (2 if RELAY_3_MODE_LOWER == "light" else 0) }
  SL_RELAY_4_MODE: ${ 1 if RELAY_4_MODE_LOWER == "switch" else (2 if RELAY_4_MODE_LOWER == "light" else 0) }

  RELAY_MODE_TEXT_SWITCH: "Switch"
  RELAY_MODE_TEXT_LIGHT: "Light"
  RELAY_MODE_TEXT_NOT_USED: "Not in use"

  # Restore is plain ESPHome-native preferences (the old globals-based custom engine was
  # removed in bfd4e45; `restore_from_nvs` in _common.yaml is now empty and is extended
  # only by _hw_buttons.yaml for the button-action selects).
  # Take care changing these: relay state is persisted TWICE - once by light_output_N and
  # again by sw_relay_N - and `internal:` does not stop an entity restoring. The two are
  # set up back to back (LightState 799, TemplateSwitch 798), so a disagreement resolves
  # in microseconds rather than being visible - but it can still leave the relay in the
  # wrong final state. Relay toggles call persist_relay_prefs so both keys are flushed
  # together and cannot drift apart across a reboot.
  RELAYS_LIGHT_RESTORE_MODE: RESTORE_DEFAULT_OFF
  RELAYS_LIGHT_PARTITION_RESTORE_MODE: RESTORE_DEFAULT_OFF
  RELAYS_EXPOSE_LEDS_TO_HA_RESTORE_MODE: RESTORE_DEFAULT_OFF
  RELAYS_SWITCH_RESTORE_MODE: RESTORE_DEFAULT_OFF

  TAG_HW_RELAYS: tx_ultimate_easy.hw.relays

esphome:
  build_flags:
    - -D TX_ULTIMATE_EASY_HW_RELAYS

globals:
  - id: boot_initialization_relays
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_initialization_relays_group_assignments
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_initialization_relays_light_modes
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_initialization_relays_relay_modes
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: gb_lights_1  # Bottom region per relay (group 1)
    type: std::vector<light::LightState*>
    restore_value: false
  - id: gb_lights_2  # Top region per relay (group 2)
    type: std::vector<light::LightState*>
    restore_value: false
  - id: gb_lights_3  # Side region per relay (group 3) — empty where a relay has no side arc
    type: std::vector<light::LightState*>
    restore_value: false

  - id: relay_1_state
    type: bool
    initial_value: 'false'
  - id: relay_2_state
    type: bool
    initial_value: 'false'
  - id: relay_3_state
    type: bool
    initial_value: 'false'
  - id: relay_4_state
    type: bool
    initial_value: 'false'

light:
  # These lights are used for the physical relays to be shown as lights
  - id: light_output_1
    name: Relay 1 light
    output: output_relay_1
    platform: binary
    internal: ${SL_RELAY_1_MODE != 2 or gang_count < 1}
    restore_mode: ${RELAYS_LIGHT_RESTORE_MODE}
    on_turn_on:
      then:
        - lambda: |-
            id(relay_1_state) = true;
            show_relay_status->execute();
    on_turn_off:
      then:
        - lambda: |-
            id(relay_1_state) = false;
            show_relay_status->execute();
  - id: light_output_2
    name: Relay 2 light
    output: output_relay_2
    platform: binary
    internal: ${SL_RELAY_2_MODE != 2 or gang_count < 2}
    restore_mode: ${RELAYS_LIGHT_RESTORE_MODE}
    on_turn_on:
      then:
        - lambda: |-
            id(relay_2_state) = true;
            show_relay_status->execute();
    on_turn_off:
      then:
        - lambda: |-
            id(relay_2_state) = false;
            show_relay_status->execute();
  - id: light_output_3
    name: Relay 3 light
    output: output_relay_3
    platform: binary
    internal: ${SL_RELAY_3_MODE != 2 or gang_count < 3}
    restore_mode: ${RELAYS_LIGHT_RESTORE_MODE}
    on_turn_on:
      then:
        - lambda: |-
            id(relay_3_state) = true;
            show_relay_status->execute();
    on_turn_off:
      then:
        - lambda: |-
            id(relay_3_state) = false;
            show_relay_status->execute();
  - id: light_output_4
    name: Relay 4 light
    output: output_relay_4
    platform: binary
    internal: ${SL_RELAY_4_MODE != 2 or gang_count < 4}
    restore_mode: ${RELAYS_LIGHT_RESTORE_MODE}
    on_turn_on:
      then:
        - lambda: |-
            id(relay_4_state) = true;
            show_relay_status->execute();
    on_turn_off:
      then:
        - lambda: |-
            id(relay_4_state) = false;
            show_relay_status->execute();

  # ── Per-relay indicator style (config; each persists its own state in NVS) ──
  # These drive no hardware of their own (the outputs are no-ops) — they are the style
  # store for that relay's LED indicator, read back in light_set_state / show_relay_status:
  #   on/off     → whether this relay lights the ring at all (master enable)
  #   colour     → the indicator hue
  #   brightness → how bright the indicator is
  # ESPHome normalises RGB so the largest channel is always 1.0 and keeps the intensity in
  # `brightness` (light_color_values.h, normalize_color), which is why both have to be read.
  - &relay_color_light
    id: relay_1_color
    name: Relay 1 indicator
    platform: rgb
    red: relay_1_color_r_out
    green: relay_1_color_g_out
    blue: relay_1_color_b_out
    internal: ${gang_count < 1}
    entity_category: config
    disabled_by_default: false
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s   # apply the picked color instantly (no 1s ramp) so it saves right away
    on_state:
      then:
        - script.execute: show_relay_status
        - script.execute: persist_relay_prefs
  - id: relay_2_color
    name: Relay 2 indicator
    red: relay_2_color_r_out
    green: relay_2_color_g_out
    blue: relay_2_color_b_out
    internal: ${gang_count < 2}
    <<: *relay_color_light
  - id: relay_3_color
    name: Relay 3 indicator
    red: relay_3_color_r_out
    green: relay_3_color_g_out
    blue: relay_3_color_b_out
    internal: ${gang_count < 3}
    <<: *relay_color_light
  - id: relay_4_color
    name: Relay 4 indicator
    red: relay_4_color_r_out
    green: relay_4_color_g_out
    blue: relay_4_color_b_out
    internal: ${gang_count < 4}
    <<: *relay_color_light

  # These lights are used to indicate relay's statuses.
  # Each relay owns an arc of the ring, split into physical regions:
  #   Bottom / Side / Top  (the "All" mode lights every region the relay owns).
  # EU ring regions: Bottom 6-12 · Left 13-19 · Top 20-26 · Right 0-5+27
  # ── 1 gang: the single relay owns the WHOLE ring ──
  - &light_partition_relays
    id: light_rl_1_1_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}
    name: Light - Relay 1 of 1 (${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT})
    platform: partition
    internal: ${not expose_relays_leds_to_ha or gang_count != 1}
    disabled_by_default: false
    default_transition_length: ${default_transition_length}
    restore_mode: ${RELAYS_LIGHT_PARTITION_RESTORE_MODE}
    segments:
      - id: light_full
        from: ${6 if IS_EU_MODEL else 9}
        to: ${12 if IS_EU_MODEL else 14}
  - id: light_rl_1_1_${LIGHT_MODE_SIDE_TEXT}
    name: Light - Relay 1 of 1 (${LIGHT_MODE_SIDE_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 1}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${13 if IS_EU_MODEL else 15}
        to: ${19 if IS_EU_MODEL else 24}
      - id: light_full
        from: ${27 if IS_EU_MODEL else 31}
        to: ${27 if IS_EU_MODEL else 31}
      - id: light_full
        from: 0
        to: ${5 if IS_EU_MODEL else 8}
  - id: light_rl_1_1_${LIGHT_MODE_TOP_OR_RIGHT_TEXT}
    name: Light - Relay 1 of 1 (${LIGHT_MODE_TOP_OR_RIGHT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 1}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${20 if IS_EU_MODEL else 25}
        to: ${26 if IS_EU_MODEL else 30}
  # ── 2 gang: relay 1 = left half, relay 2 = right half ──
  - id: light_rl_1_2_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}
    name: Light - Relay 1 of 2 (${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 2}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${9 if IS_EU_MODEL else 12}
        to: ${12 if IS_EU_MODEL else 14}
  - id: light_rl_1_2_${LIGHT_MODE_SIDE_TEXT}
    name: Light - Relay 1 of 2 (${LIGHT_MODE_SIDE_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 2}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${13 if IS_EU_MODEL else 15}
        to: ${19 if IS_EU_MODEL else 24}
  - id: light_rl_1_2_${LIGHT_MODE_TOP_OR_RIGHT_TEXT}
    name: Light - Relay 1 of 2 (${LIGHT_MODE_TOP_OR_RIGHT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 2}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${20 if IS_EU_MODEL else 25}
        to: ${23 if IS_EU_MODEL else 27}
  - id: light_rl_2_2_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}
    name: Light - Relay 2 of 2 (${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 2}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${6 if IS_EU_MODEL else 9}
        to: ${8 if IS_EU_MODEL else 11}
  - id: light_rl_2_2_${LIGHT_MODE_SIDE_TEXT}
    name: Light - Relay 2 of 2 (${LIGHT_MODE_SIDE_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 2}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${27 if IS_EU_MODEL else 31}
        to: ${27 if IS_EU_MODEL else 31}
      - id: light_full
        from: 0
        to: ${5 if IS_EU_MODEL else 8}
  - id: light_rl_2_2_${LIGHT_MODE_TOP_OR_RIGHT_TEXT}
    name: Light - Relay 2 of 2 (${LIGHT_MODE_TOP_OR_RIGHT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 2}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${24 if IS_EU_MODEL else 28}
        to: ${26 if IS_EU_MODEL else 30}
  # ── 3 gang: relay 1 = left, relay 2 = middle (top+bottom only), relay 3 = right ──
  - id: light_rl_1_3_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}
    name: Light - Relay 1 of 3 (${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
