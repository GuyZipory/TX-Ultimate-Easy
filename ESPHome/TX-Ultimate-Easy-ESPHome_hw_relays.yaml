  - id: light_rl_1_3_${LIGHT_MODE_SIDE_TEXT}
    name: Light - Relay 1 of 3 (${LIGHT_MODE_SIDE_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${13 if IS_EU_MODEL else 15}
        to: ${19 if IS_EU_MODEL else 24}
  - id: light_rl_1_3_${LIGHT_MODE_TOP_OR_RIGHT_TEXT}
    name: Light - Relay 1 of 3 (${LIGHT_MODE_TOP_OR_RIGHT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${20 if IS_EU_MODEL else 25}
        to: ${21 if IS_EU_MODEL else 26}
  - id: light_rl_2_3_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}
    name: Light - Relay 2 of 3 (${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${8 if IS_EU_MODEL else 11}
        to: ${10 if IS_EU_MODEL else 12}
  - id: light_rl_2_3_${LIGHT_MODE_TOP_OR_RIGHT_TEXT}
    name: Light - Relay 2 of 3 (${LIGHT_MODE_TOP_OR_RIGHT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${22 if IS_EU_MODEL else 27}
        to: ${24 if IS_EU_MODEL else 28}
  - id: light_rl_3_3_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}
    name: Light - Relay 3 of 3 (${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${6 if IS_EU_MODEL else 9}
        to: ${7 if IS_EU_MODEL else 10}
  - id: light_rl_3_3_${LIGHT_MODE_SIDE_TEXT}
    name: Light - Relay 3 of 3 (${LIGHT_MODE_SIDE_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${27 if IS_EU_MODEL else 31}
        to: ${27 if IS_EU_MODEL else 31}
      - id: light_full
        from: 0
        to: ${5 if IS_EU_MODEL else 8}
  - id: light_rl_3_3_${LIGHT_MODE_TOP_OR_RIGHT_TEXT}
    name: Light - Relay 3 of 3 (${LIGHT_MODE_TOP_OR_RIGHT_TEXT})
    internal: ${not expose_relays_leds_to_ha or gang_count != 3}
    <<: *light_partition_relays
    segments:
      - id: light_full
        from: ${25 if IS_EU_MODEL else 29}
        to: ${26 if IS_EU_MODEL else 30}
