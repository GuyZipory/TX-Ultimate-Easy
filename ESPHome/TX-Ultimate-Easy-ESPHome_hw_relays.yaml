output:
  - id: output_relay_1
    platform: gpio
    pin: GPIO18
  - id: output_relay_2
    platform: gpio
    pin: GPIO17
  - id: output_relay_3
    platform: gpio
    pin: GPIO27
  - id: output_relay_4
    platform: gpio
    pin: GPIO23

  # ── No-op float outputs backing the per-relay color pickers ──────────────
  - &relay_color_out
    id: relay_1_color_r_out
    platform: template
    type: float
    write_action:
      - lambda: return;
  - id: relay_1_color_g_out
    <<: *relay_color_out
  - id: relay_1_color_b_out
    <<: *relay_color_out
  - id: relay_2_color_r_out
    <<: *relay_color_out
  - id: relay_2_color_g_out
    <<: *relay_color_out
  - id: relay_2_color_b_out
    <<: *relay_color_out
  - id: relay_3_color_r_out
    <<: *relay_color_out
  - id: relay_3_color_g_out
    <<: *relay_color_out
  - id: relay_3_color_b_out
    <<: *relay_color_out
  - id: relay_4_color_r_out
    <<: *relay_color_out
  - id: relay_4_color_g_out
    <<: *relay_color_out
  - id: relay_4_color_b_out
    <<: *relay_color_out

script:
  - id: !extend boot_initialize
    then:
      - script.execute: boot_initialize_relays

  - id: !extend boot_done
    then:
      # bs_boot_completed is ON at this point (set by the base boot_done), so the
      # guard in show_relay_status no longer short-circuits. Repaint relay LEDs once
      # to reflect the relay state that was restored (but deferred) during boot.
      - script.execute: show_relay_status

  - id: boot_initialize_relays
    # Runs once at boot (triggered by boot_initialize). "single" mode means stray
    # re-triggers during boot are ignored instead of cancelling in-progress work.
    mode: single
    then:
      - script.execute: boot_initialize_relays_group_assignments
      - script.execute: boot_initialize_relays_light_modes
      - script.execute: boot_initialize_relays_relay_modes
      - script.wait: boot_initialize_relays_group_assignments
      - script.wait: boot_initialize_relays_light_modes
      - script.wait: boot_initialize_relays_relay_modes
      - wait_until:
          condition:
            - lambda: return id(boot_initialization_relays_group_assignments);
            - lambda: return id(boot_initialization_relays_light_modes);
            - lambda: return id(boot_initialization_relays_relay_modes);
          # Bounded so the single-threaded loop is never blocked indefinitely.
          timeout: 5s
      # Always release downstream waiters, even if the wait_until above timed out.
      - globals.set:
          id: boot_initialization_relays
          value: 'true'

  - id: boot_initialize_relays_group_assignments
    mode: restart
    then:
      - lambda: |-
          // LED Group Assignment:
          // - For US model: gb_lights_1 = left side LEDs, gb_lights_2 = right side LEDs
          // - For EU model: gb_lights_1 = bottom LEDs, gb_lights_2 = top LEDs
          // Gang configurations determine which LED segments are active
          // Group 1 = Bottom region, Group 2 = Top region, Group 3 = Side region.
          // Group 3 is only populated for gang counts whose relays own a side arc
          // (1 and 2 gang); it stays empty otherwise and Side/All degrade gracefully.
          #if defined(TX_ULTIMATE_EASY_GANG_COUNT) && (TX_ULTIMATE_EASY_GANG_COUNT == 1)
          id(gb_lights_1) = { light_rl_1_1_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT} };
          id(gb_lights_2) = { light_rl_1_1_${LIGHT_MODE_TOP_OR_RIGHT_TEXT} };
          id(gb_lights_3) = { light_rl_1_1_${LIGHT_MODE_SIDE_TEXT} };
          #elif (TX_ULTIMATE_EASY_GANG_COUNT == 2)
          id(gb_lights_1) = { light_rl_1_2_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT},
                              light_rl_2_2_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT} };
          id(gb_lights_2) = { light_rl_1_2_${LIGHT_MODE_TOP_OR_RIGHT_TEXT},
                              light_rl_2_2_${LIGHT_MODE_TOP_OR_RIGHT_TEXT} };
          id(gb_lights_3) = { light_rl_1_2_${LIGHT_MODE_SIDE_TEXT},
                              light_rl_2_2_${LIGHT_MODE_SIDE_TEXT} };
          #elif (TX_ULTIMATE_EASY_GANG_COUNT == 3)
          id(gb_lights_1) = { light_rl_1_3_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT},
                              light_rl_2_3_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT},
                              light_rl_3_3_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT} };
          id(gb_lights_2) = { light_rl_1_3_${LIGHT_MODE_TOP_OR_RIGHT_TEXT},
                              light_rl_2_3_${LIGHT_MODE_TOP_OR_RIGHT_TEXT},
                              light_rl_3_3_${LIGHT_MODE_TOP_OR_RIGHT_TEXT} };
          // Relay 2 is the middle button — top+bottom only, no side (nullptr placeholder).
          id(gb_lights_3) = { light_rl_1_3_${LIGHT_MODE_SIDE_TEXT},
                              nullptr,
                              light_rl_3_3_${LIGHT_MODE_SIDE_TEXT} };
          #elif (TX_ULTIMATE_EASY_GANG_COUNT == 4)
          id(gb_lights_1) = { light_rl_1_4_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT},
                              light_rl_2_4_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT},
                              light_rl_3_4_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT},
                              light_rl_4_4_${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT} };
          id(gb_lights_2) = { light_rl_1_4_${LIGHT_MODE_TOP_OR_RIGHT_TEXT},
                              light_rl_2_4_${LIGHT_MODE_TOP_OR_RIGHT_TEXT},
                              light_rl_3_4_${LIGHT_MODE_TOP_OR_RIGHT_TEXT},
                              light_rl_4_4_${LIGHT_MODE_TOP_OR_RIGHT_TEXT} };
          // Relays 2 and 3 are the middle buttons — top+bottom only, no side (nullptr placeholders).
          id(gb_lights_3) = { light_rl_1_4_${LIGHT_MODE_SIDE_TEXT},
                              nullptr,
                              nullptr,
                              light_rl_4_4_${LIGHT_MODE_SIDE_TEXT} };
          #endif
          id(boot_initialization_relays_group_assignments) = true;

  - id: boot_initialize_relays_light_modes
    mode: restart
    then:
      - lambda: |-
          // Set this section of initialization as completed
          id(boot_initialization_relays_light_modes) = true;

  - id: boot_initialize_relays_relay_modes
    mode: restart
    then:
      - lambda: |-
          // Set this section of initialization as completed
          id(boot_initialization_relays_relay_modes) = true;

  - id: !extend button_click_event
    then:
      - lambda: |-
          // Handle only single clicks
          if (click_count != 1) {
            ESP_LOGV("${TAG_HW_RELAYS}", "Clicks: %" PRIu8, click_count);
            return;
          }

          // Ignore if other touch events are active
          if (bs_multi_touch->state ||
              bs_swipe_${ID_SWIPE_LEFT_OR_UP_TEXT}->state ||
              bs_swipe_${ID_SWIPE_RIGHT_OR_DOWN_TEXT}->state) {
            ESP_LOGV("${TAG_HW_RELAYS}", "Multi-touch: %s", YESNO(bs_multi_touch->state));
            ESP_LOGV("${TAG_HW_RELAYS}", "Swipe ${ID_SWIPE_LEFT_OR_UP_TEXT}: %s",
                                          YESNO(bs_swipe_${ID_SWIPE_LEFT_OR_UP_TEXT}->state));
            ESP_LOGV("${TAG_HW_RELAYS}", "Swipe ${ID_SWIPE_RIGHT_OR_DOWN_TEXT}: %s",
                                          YESNO(bs_swipe_${ID_SWIPE_RIGHT_OR_DOWN_TEXT}->state));
            return;
          }

          // Toggle relay if corresponding button action is enabled
          // Note: If ESP-NOW package is included, it will extend this script and send ESP-NOW commands
          // The local relay may toggle based on button action settings, and ESP-NOW will also send remote commands
          const bool api_disconnected = !global_api_server->is_connected() or
                                        !wifi_component->is_connected();
          std::string select_state;
          bool toggle_relay = false;
          if (api_disconnected) {
            ESP_LOGW("${TAG_HW_RELAYS}", "Toggle relays:");
            ESP_LOGW("${TAG_HW_RELAYS}", "  API state: DISCONNECTED");
            ESP_LOGW("${TAG_HW_RELAYS}", "  Button:    %" PRIu8, button);
          } else {
            ESP_LOGVV("${TAG_HW_RELAYS}", "Toggle relays:");
            ESP_LOGVV("${TAG_HW_RELAYS}", "  API state: Connected");
            ESP_LOGVV("${TAG_HW_RELAYS}", "  Button:    %" PRIu8, button);
          }
          switch (button) {
            case ${BUTTON_1_ID}:
              select_state = sl_button_1_action->current_option();
              toggle_relay = (select_state == "${BUTTON_1_ACTION_TEXT}" or
                              (api_disconnected and select_state == "${BUTTON_1_ACTION_FAILSAFE_TEXT}"));
              if (toggle_relay && ${SL_RELAY_1_MODE} != 0)
                sw_relay_1->toggle();
              break;
            case ${BUTTON_2_ID}:
              select_state = sl_button_2_action->current_option();
              toggle_relay = (select_state == "${BUTTON_2_ACTION_TEXT}" or
                              (api_disconnected and select_state == "${BUTTON_2_ACTION_FAILSAFE_TEXT}"));
              if (toggle_relay && ${SL_RELAY_2_MODE} != 0)
                sw_relay_2->toggle();
              break;
            case ${BUTTON_3_ID}:
              select_state = sl_button_3_action->current_option();
              toggle_relay = (select_state == "${BUTTON_3_ACTION_TEXT}" or
                              (api_disconnected and select_state == "${BUTTON_3_ACTION_FAILSAFE_TEXT}"));
              if (toggle_relay && ${SL_RELAY_3_MODE} != 0)
                sw_relay_3->toggle();
              break;
            case ${BUTTON_4_ID}:
              select_state = sl_button_4_action->current_option();
              toggle_relay = (select_state == "${BUTTON_4_ACTION_TEXT}" or
                              (api_disconnected and select_state == "${BUTTON_4_ACTION_FAILSAFE_TEXT}"));
              if (toggle_relay && ${SL_RELAY_4_MODE} != 0)
                sw_relay_4->toggle();
              break;
          }
          if (toggle_relay) {
            ESP_LOGI("${TAG_HW_RELAYS}", "Toggle relay %" PRIu8 ": (%s)", button, select_state.c_str());
          } else if (not select_state.empty()) {
            ESP_LOGV("${TAG_HW_RELAYS}", "Ignoring toggle for relay %" PRIu8 ": action is '%s'",
                                        button, select_state.c_str());
          } else {
            ESP_LOGE("${TAG_HW_RELAYS}", "No button action selected for button %" PRIu8, button);
          }

  - id: !extend dump_config
    then:
      - lambda: |-
          // Relay's modes
          #if TX_ULTIMATE_EASY_GANG_COUNT > 1
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Relays modes:");
          #else
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Relay mode:");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT > 1
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 1: ${relay_1_mode}");
          #if TX_ULTIMATE_EASY_GANG_COUNT >= 2
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 2: ${relay_2_mode}");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT >= 2
          #if TX_ULTIMATE_EASY_GANG_COUNT >= 3
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 3: ${relay_3_mode}");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT >= 3
          #if TX_ULTIMATE_EASY_GANG_COUNT >= 4
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 4: ${relay_4_mode}");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT >= 4

          // Relay's states
          #if TX_ULTIMATE_EASY_GANG_COUNT > 1
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Relays states:");
          #else
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Relay state:");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT > 1
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 1: %s", sw_relay_1->state ? "ON" : "OFF");
          #if TX_ULTIMATE_EASY_GANG_COUNT >= 2
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 2: %s", sw_relay_2->state ? "ON" : "OFF");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT >= 2
          #if TX_ULTIMATE_EASY_GANG_COUNT >= 3
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 3: %s", sw_relay_3->state ? "ON" : "OFF");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT >= 3
          #if TX_ULTIMATE_EASY_GANG_COUNT >= 4
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay 4: %s", sw_relay_4->state ? "ON" : "OFF");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT >= 4
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Expose Relay's LEDs to Home Assistant: ${expose_relays_leds_to_ha}");

          // Boot initialization statuses
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Boot initialization flags:");
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Overall:     %s", YESNO(id(boot_initialization_relays)));
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Groups:      %s", YESNO(id(boot_initialization_relays_group_assignments)));
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Light modes: %s", YESNO(id(boot_initialization_relays_light_modes)));
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay modes: %s", YESNO(id(boot_initialization_relays_relay_modes)));

          // Relay LED indicators. All four selects/lights are always instantiated (only their
          // `internal:` flag varies with gang_count), so indexing them is safe.
          // Assigning current_option() into a std::string works on every supported ESPHome:
          // it returns StringRef since 2026.x, which converts implicitly (core/string_ref.h).
          #if TX_ULTIMATE_EASY_GANG_COUNT > 1
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Relay LED indicators:");
          #else
          ESP_LOGCONFIG("${TAG_HW_RELAYS}", "Relay LED indicator:");
          #endif  // TX_ULTIMATE_EASY_GANG_COUNT > 1
          {
            esphome::select::Select *areas[] = {sl_relay_1_light_mode, sl_relay_2_light_mode,
                                                sl_relay_3_light_mode, sl_relay_4_light_mode};
            light::LightState *styles[] = {id(relay_1_color), id(relay_2_color),
                                           id(relay_3_color), id(relay_4_color)};
            for (uint8_t i = 0; i < TX_ULTIMATE_EASY_GANG_COUNT; i++) {
              const std::string area = areas[i]->current_option();
              const auto &sv = styles[i]->current_values;
              ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Relay %" PRIu8 ": %s · area %s · %.0f%% brightness",
                            i + 1, ONOFF(sv.is_on()), area.c_str(), sv.get_brightness() * 100.0f);
            }
          }
          static const uint8_t LIGHT_BRIGHTNESS_TURN_ON = ${LIGHT_BRIGHTNESS_TURN_ON};
          if (LIGHT_BRIGHTNESS_TURN_ON > 0 and LIGHT_BRIGHTNESS_TURN_ON <= 100)
            ESP_LOGCONFIG("${TAG_HW_RELAYS}", "  Overridden by LIGHT_BRIGHTNESS_TURN_ON: %" PRIu8 "%%",
                          LIGHT_BRIGHTNESS_TURN_ON);

  - id: !extend dump_config_list_packages
    then:
      - script.wait: dump_config
      - lambda: |-
          // Check for requirements
          #ifndef TX_ULTIMATE_EASY_COMMON
            #error "The package TX-Ultimate-Easy-ESPHome_common.yaml is required."
          #endif
          #ifndef TX_ULTIMATE_EASY_HW_LEDS
            #error "The package TX-Ultimate-Easy-ESPHome_hw_leds.yaml is required."
          #endif  // TX_ULTIMATE_EASY_HW_LEDS

          // Identify itself
          ESP_LOGCONFIG(ESPHOME_PROJECT_NAME, "  - Hardware - Relays");

  - id: light_set_state
    mode: parallel
    parameters:
      light_group: uint8_t
      light_index: uint8_t
      state: bool
    then:
      - lambda: |-
          // Night mode holds the LED state — skip all automatic relay-triggered updates.
          #ifdef TX_ULTIMATE_EASY_NIGHT_MODE
          if (sw_night_mode->state) {
            ESP_LOGV("${TAG_HW_RELAYS}", "Night mode active - skipping LED update");
            return;
          }
          #endif  // TX_ULTIMATE_EASY_NIGHT_MODE

          // The user is driving the ring by hand (LED ring is on) — it owns the strip until
          // it is turned off, at which point its on_turn_off handler repaints the indicators.
          if (id(leds_manual_override)) {
            ESP_LOGV("${TAG_HW_RELAYS}", "Manual LED control active - skipping LED update");
            return;
          }

          ESP_LOGV("${TAG_HW_RELAYS}", "script: light_set_state");
          ESP_LOGV("${TAG_HW_RELAYS}", "  light_group: %" PRIu8, light_group);
          ESP_LOGV("${TAG_HW_RELAYS}", "  light_index: %" PRIu8, light_index);
          ESP_LOGV("${TAG_HW_RELAYS}", "  state: %s", ONOFF(state));

          static const uint32_t LIGHT_TRANSITION_TURN_ON = ${LIGHT_TRANSITION_TURN_ON};
          static const uint32_t LIGHT_TRANSITION_TURN_OFF = ${LIGHT_TRANSITION_TURN_OFF};
          static const uint8_t LIGHT_BRIGHTNESS_TURN_ON = ${LIGHT_BRIGHTNESS_TURN_ON};

          // Per-relay style from that relay's indicator light (defaults to white, full).
          // get_red/green/blue() carry only the hue: normalize_color() rescales them so the
          // largest channel is 1.0 and parks the intensity in brightness, so reading the
          // channels alone would pin every indicator at full brightness.
          float cr = 1.0f, cg = 1.0f, cb = 1.0f, cbri = 1.0f;
          light::LightState *style = nullptr;
          switch (light_index) {
            case 0: style = id(relay_1_color); break;
            case 1: style = id(relay_2_color); break;
            case 2: style = id(relay_3_color); break;
            case 3: style = id(relay_4_color); break;
          }
          if (style != nullptr) {
            const auto &sv = style->current_values;
            cr = sv.get_red();
            cg = sv.get_green();
            cb = sv.get_blue();
            cbri = sv.get_brightness();
          }
          // Legacy build-time override: when set (1-100) it wins over the per-relay value.
          // 0 (the default) means "use whatever the indicator light says".
          if (LIGHT_BRIGHTNESS_TURN_ON > 0 and LIGHT_BRIGHTNESS_TURN_ON <= 100)
            cbri = LIGHT_BRIGHTNESS_TURN_ON / 100.0f;

          switch (light_group) {
            case 1:
              if (light_index >= id(gb_lights_1).size()) {
                ESP_LOGE("${TAG_HW_RELAYS}",
                          "Invalid set with ${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT} light for Relay %" PRIu8, light_index+1);
                return;
              }
              if (state) {
                ESP_LOGI("${TAG_HW_RELAYS}",
                          "Turn-on ${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT} light for Relay %" PRIu8, light_index+1);
                auto call = id(gb_lights_1)[light_index]->turn_on();
                call.set_rgb(cr, cg, cb);
                if (LIGHT_TRANSITION_TURN_ON > 0)
                  call.set_transition_length(LIGHT_TRANSITION_TURN_ON);  // in ms
                call.set_brightness(cbri);
                call.perform();
              } else {
                ESP_LOGI("${TAG_HW_RELAYS}",
                          "Turn-off ${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT} light for Relay %" PRIu8, light_index+1);
                auto call = id(gb_lights_1)[light_index]->turn_off();
                if (LIGHT_TRANSITION_TURN_OFF > 0)
                  call.set_transition_length(LIGHT_TRANSITION_TURN_OFF);  // in ms
                call.perform();
              }
              break;
            case 2:
              if (light_index >= id(gb_lights_2).size()) {
                ESP_LOGE("${TAG_HW_RELAYS}",
                          "Invalid set with ${LIGHT_MODE_TOP_OR_RIGHT_TEXT} light for Relay %" PRIu8, light_index+1);
                return;
              }
              if (state) {
                ESP_LOGI("${TAG_HW_RELAYS}",
                          "Turn-on ${LIGHT_MODE_TOP_OR_RIGHT_TEXT} light for Relay %" PRIu8, light_index+1);
                auto call = id(gb_lights_2)[light_index]->turn_on();
                call.set_rgb(cr, cg, cb);
                if (LIGHT_TRANSITION_TURN_ON > 0)
                  call.set_transition_length(LIGHT_TRANSITION_TURN_ON);  // in ms
                call.set_brightness(cbri);
                call.perform();
              } else {
                ESP_LOGI("${TAG_HW_RELAYS}",
                          "Turn-off ${LIGHT_MODE_TOP_OR_RIGHT_TEXT} light for Relay %" PRIu8, light_index+1);
                auto call = id(gb_lights_2)[light_index]->turn_off();
                if (LIGHT_TRANSITION_TURN_OFF > 0)
                  call.set_transition_length(LIGHT_TRANSITION_TURN_OFF);  // in ms
                call.perform();
              }
              break;
            case 3:
              // Side region. A relay without a side arc (middle buttons on 3/4 gang,
              // or gangs with no side group) has an out-of-range index or a nullptr
              // placeholder here — both are expected, not an error.
              if (light_index >= id(gb_lights_3).size() ||
                  id(gb_lights_3)[light_index] == nullptr) {
                ESP_LOGV("${TAG_HW_RELAYS}",
                          "No ${LIGHT_MODE_SIDE_TEXT} light for Relay %" PRIu8, light_index+1);
                return;
              }
              if (state) {
                ESP_LOGI("${TAG_HW_RELAYS}",
                          "Turn-on ${LIGHT_MODE_SIDE_TEXT} light for Relay %" PRIu8, light_index+1);
                auto call = id(gb_lights_3)[light_index]->turn_on();
                call.set_rgb(cr, cg, cb);
                if (LIGHT_TRANSITION_TURN_ON > 0)
                  call.set_transition_length(LIGHT_TRANSITION_TURN_ON);  // in ms
                call.set_brightness(cbri);
                call.perform();
              } else {
                ESP_LOGI("${TAG_HW_RELAYS}",
                          "Turn-off ${LIGHT_MODE_SIDE_TEXT} light for Relay %" PRIu8, light_index+1);
                auto call = id(gb_lights_3)[light_index]->turn_off();
                if (LIGHT_TRANSITION_TURN_OFF > 0)
                  call.set_transition_length(LIGHT_TRANSITION_TURN_OFF);  // in ms
                call.perform();
              }
              break;
            default:
              ESP_LOGE("${TAG_HW_RELAYS}", "Invalid light_group=%" PRIu8 " (expected 1, 2 or 3)", light_group);
              break;
          }

  # Flush just-changed relay preferences (color AND light mode) to flash.
  # ESPHome batches preference writes (~60s), so a sudden power cut would lose
  # them. Wait briefly so the entity's own state-save has landed in the
  # preferences buffer, then sync() forces the write immediately so the choice
  # survives a power cut. mode: restart coalesces rapid changes (e.g. dragging
  # the color wheel, or flipping the mode select a few times).
  - id: persist_relay_prefs
    mode: restart
    then:
      - delay: 800ms
      - lambda: global_preferences->sync();

  - id: show_relay_status
    mode: restart
    then:
      # Skip the visual LED sync during boot. Relay *state* restoration still happens
      # via the switch handlers; only the LED painting is deferred until boot_done
      # repaints it. A bare leading `lambda: return;` would NOT work here, since a
      # return only exits the lambda and the script would fall through to the paint.
      - if:
          condition:
            - binary_sensor.is_on: bs_boot_completed
          then:
            # Bounded wait for relay boot initialization. script.wait has no timeout,
            # so wait_until is used as defense-in-depth against an indefinite block.
            - wait_until:
                condition:
                  lambda: return id(boot_initialization_relays);
                timeout: 10s
            - lambda: |-
                if (not id(boot_initialization_relays)) {
                  ESP_LOGW("${TAG_HW_RELAYS}", "Relays not initialized yet");
                  return;
                }
                for (uint8_t i = 0; i < ${gang_count}; i++) {
                  bool relay_state = false;
                  bool indicator_on = true;
                  std::string light_mode;

                  // Determine relay state, indicator master enable and lit area
                  switch (i) {
                    case 0:
                      relay_state = id(relay_1_state);
                      indicator_on = id(relay_1_color)->current_values.is_on();
                      light_mode = sl_relay_1_light_mode->current_option();
                      break;
                    case 1:
                      relay_state = id(relay_2_state);
                      indicator_on = id(relay_2_color)->current_values.is_on();
                      light_mode = sl_relay_2_light_mode->current_option();
                      break;
                    case 2:
                      relay_state = id(relay_3_state);
                      indicator_on = id(relay_3_color)->current_values.is_on();
                      light_mode = sl_relay_3_light_mode->current_option();
                      break;
                    case 3:
                      relay_state = id(relay_4_state);
                      indicator_on = id(relay_4_color)->current_values.is_on();
                      light_mode = sl_relay_4_light_mode->current_option();
                      break;
                  }

                  ESP_LOGV("${TAG_HW_RELAYS}", "Relay %" PRIu8 " is %s", i + 1, relay_state ? "ON" : "OFF");
                  ESP_LOGV("${TAG_HW_RELAYS}", "Indicator for Relay %" PRIu8 ": %s", i + 1, ONOFF(indicator_on));
                  ESP_LOGV("${TAG_HW_RELAYS}", "Indicator area for Relay %" PRIu8 ": %s", i + 1, light_mode.c_str());

                  // Reconcile every region for this relay so deselected regions are
                  // explicitly turned off (self-correcting on any state/area/style change).
                  // "All" lights every region the relay owns; an indicator light that the user
                  // switched off leaves all three wanted=false, turning everything off.
                  const bool active = relay_state && indicator_on;
                  const bool all = (light_mode == "${LIGHT_MODE_ALL_TEXT}");
                  const bool want_bottom = active && (all || light_mode == "${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}");
                  const bool want_top    = active && (all || light_mode == "${LIGHT_MODE_TOP_OR_RIGHT_TEXT}");
                  const bool want_side   = active && (all || light_mode == "${LIGHT_MODE_SIDE_TEXT}");
                  light_set_state->execute(1, i, want_bottom);  // Bottom region
                  light_set_state->execute(2, i, want_top);     // Top region
                  if (i < id(gb_lights_3).size())
                    light_set_state->execute(3, i, want_side);  // Side region (where present)
                }

select:
  # Which physical region of the relay's arc the indicator lights:
  #   Bottom · Side · Top · All   (All = every region the relay owns)
  # There is deliberately no "Disabled" option — turning the relay's indicator light off is
  # the single way to disable it, so there are not two controls meaning the same thing.
  # show_relay_status reconciles all regions on every change, so on_value just
  # re-runs it; no per-relay transition bookkeeping is needed.
  - &relay_light_mode
    id: sl_relay_1_light_mode
    name: Relay 1 indicator area
    platform: template
    options:
      - "${LIGHT_MODE_BOTTOM_OR_LEFT_TEXT}"
      - "${LIGHT_MODE_SIDE_TEXT}"
      - "${LIGHT_MODE_TOP_OR_RIGHT_TEXT}"
      - "${LIGHT_MODE_ALL_TEXT}"
    initial_option: "${LIGHT_MODE_ALL_TEXT}"
    optimistic: true
    restore_value: ${gang_count >= 1}
    internal: ${gang_count < 1}
    entity_category: config
    disabled_by_default: false
    icon: mdi:dots-square
    on_value:
      - script.execute: show_relay_status
      - script.execute: persist_relay_prefs   # flush the chosen mode so it survives a power cut

  - id: sl_relay_2_light_mode
    name: Relay 2 indicator area
    restore_value: ${gang_count >= 2}
    internal: ${gang_count < 2}
    <<: *relay_light_mode

  - id: sl_relay_3_light_mode
    name: Relay 3 indicator area
    restore_value: ${gang_count >= 3}
    internal: ${gang_count < 3}
    <<: *relay_light_mode

  - id: sl_relay_4_light_mode
    name: Relay 4 indicator area
    restore_value: ${gang_count >= 4}
    internal: ${gang_count < 4}
    <<: *relay_light_mode

switch:
  - id: sw_relay_1
    name: Relay 1
    internal: ${SL_RELAY_1_MODE != 1 or gang_count < 1}
    restore_mode: ${RELAYS_SWITCH_RESTORE_MODE}
    platform: template
    lambda: |-
      return id(relay_1_state);
    turn_on_action:
      - lambda: id(relay_1_state) = true;
      - light.turn_on: light_output_1
      # ESPHome batches preference writes (~60s), so without an explicit flush a relay
      # toggled shortly before an OTA or a power cut comes back in the stale state.
      - script.execute: persist_relay_prefs
    turn_off_action:
      - lambda: id(relay_1_state) = false;
      - light.turn_off: light_output_1
      - script.execute: persist_relay_prefs

