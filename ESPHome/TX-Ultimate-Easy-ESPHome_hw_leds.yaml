####################################################################################################
#####                              TX Ultimate Easy for ESPHome                                #####
#####                  Repository: https://github.com/GuyZipory/TX-Ultimate-Easy               #####
####################################################################################################
##### Purpose: ESPHome - Hardware - LEDs                                                       #####
####################################################################################################
##### Author: edwardtfn - https://github.com/edwardtfn - https://buymeacoffee.com/edwardfirmo  #####
##### Fork maintained by: GuyZipory - https://github.com/GuyZipory                             #####
####################################################################################################
##### NOTE:                                                                                    #####
##### - Make changes ONLY if absolutely necessary and you have the required knowledge.         #####
##### - For normal system use, modifications to this file are NOT required.                    #####
####################################################################################################
---
substitutions:
  default_transition_length: 500ms

  LIGHT_MODE_LEFT_TEXT: "Left"
  LIGHT_MODE_RIGHT_TEXT: "Right"
  LIGHT_MODE_BOTTOM_TEXT: "Bottom"
  LIGHT_MODE_TOP_TEXT: "Top"
  LIGHT_MODE_SIDE_TEXT: "Side"   # the relay's side arc (left for left-half relays, right for right-half relays)
  LIGHT_MODE_ALL_TEXT: "All"     # the relay's full allocated arc (bottom + side + top)
  LIGHT_MODE_BOTTOM_OR_LEFT_TEXT: ${LIGHT_MODE_BOTTOM_TEXT if IS_EU_MODEL else LIGHT_MODE_LEFT_TEXT}
  LIGHT_MODE_TOP_OR_RIGHT_TEXT: ${LIGHT_MODE_TOP_TEXT if IS_EU_MODEL else LIGHT_MODE_RIGHT_TEXT}

  LIGHT_TRANSITION_TURN_ON: 0   # Transition time in msec
  LIGHT_TRANSITION_TURN_OFF: 0  # Transition time in msec
  LIGHT_BRIGHTNESS_TURN_ON: 0   # Brightness (1 to 100%, 0 to not set it)

  LIGHT_FULL_RESTORE_MODE: RESTORE_DEFAULT_OFF
  LIGHT_RING_RESTORE_MODE: RESTORE_DEFAULT_OFF

  LIGHT_LED_COUNT: ${28 if IS_EU_MODEL else 32}
  LIGHT_MAX_ADDR: ${27 if IS_EU_MODEL else 31}

  TAG_HW_LEDS: tx_ultimate_easy.hw.leds

esphome:
  build_flags:
    - -D TX_ULTIMATE_EASY_HW_LEDS

globals:
  # True while the user is driving the ring by hand (lights_all is on). Relay indicators
  # stand down for as long as this is set, instead of the two fighting over the same LEDs.
  # Not restored: the lights_all on_turn_on trigger re-asserts it at boot if that light
  # comes back on.
  - id: leds_manual_override
    type: bool
    restore_value: false
    initial_value: 'false'

light:
  # These lights are controlling the LEDs on the device
  - id: light_full
    name: Light - All
    internal: true
    num_leds: 32
    pin: GPIO13
    restore_mode: ${LIGHT_FULL_RESTORE_MODE}
    platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
    max_refresh_rate: 33ms
    use_psram: false
    # platform: neopixelbus
    # type: GRB
    # variant: WS2811

  # Manual control of the whole ring, plus the effects library.
  #
  # This light and the relay indicators (light_rl_* in _hw_relays.yaml) are peer partitions
  # over the same physical strip, so without arbitration they overwrite each other. While this
  # light is on it owns the ring: leds_manual_override tells light_set_state to stand down, and
  # turning it off hands control back (see the on_turn_off handler below).
  - id: lights_all
    name: LED ring
    platform: partition
    default_transition_length: ${default_transition_length}
    internal: false
    restore_mode: ${LIGHT_RING_RESTORE_MODE}
    on_turn_on:
      then:
        - lambda: id(leds_manual_override) = true;
    on_turn_off:
      then:
        # LightTurnOffTrigger fires once the transition has actually completed
        # (light/automation.h LightTurnOffTrigger), so the repaint below cannot be
        # overwritten by a still-running fade-out.
        - lambda: |-
            id(leds_manual_override) = false;
            // Both packages below are optional; the guards keep this file (part of _core)
            // free of a hard dependency on them.
            #ifdef TX_ULTIMATE_EASY_NIGHT_MODE
            if (sw_night_mode->state) {
              night_mode_apply->execute();
              return;
            }
            #endif  // TX_ULTIMATE_EASY_NIGHT_MODE
            #ifdef TX_ULTIMATE_EASY_HW_RELAYS
            show_relay_status->execute();
            #endif  // TX_ULTIMATE_EASY_HW_RELAYS
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          width: ${LIGHT_LED_COUNT}
      - addressable_rainbow:
          name: "Rainbow - Fast"
          width: ${LIGHT_LED_COUNT}
          speed: 50
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 1s
      - pulse:
          name: "Pulse - Slow"
          transition_length: 2s
          update_interval: 2s
      - addressable_scan:
          name: "Scan"
          move_interval: 100ms
          scan_width: 3
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 5%
          progress_interval: 4ms
      - addressable_random_twinkle:
          name: "Random Twinkle"
          twinkle_probability: 20%
          progress_interval: 32ms
      - addressable_fireworks:
          name: "Fireworks"
          update_interval: 32ms
          spark_probability: 10%
          use_random_color: false
          fade_out_rate: 120
      - addressable_flicker:
          name: "Flicker"
          update_interval: 16ms
          intensity: 5%
      - random:
          name: "Random"
    segments:
      - id: light_full
        from: 0
        to: ${LIGHT_MAX_ADDR}

script:
  - id: !extend dump_config
    then:
      - lambda: |-
          ESP_LOGCONFIG("${TAG_HW_LEDS}", "Transition times:\n"
                                          "  Default:     ${default_transition_length}\n"
                                          "  Turning on:  ${LIGHT_TRANSITION_TURN_ON ~ 'ms' if LIGHT_TRANSITION_TURN_ON > 0 else 'Disabled'}\n"
                                          "  Turning off: ${LIGHT_TRANSITION_TURN_OFF ~ 'ms' if LIGHT_TRANSITION_TURN_OFF > 0 else 'Disabled'}");
          ESP_LOGCONFIG("${TAG_HW_LEDS}", "LED restore modes:\n"
                                          "  Strip:    ${LIGHT_FULL_RESTORE_MODE}\n"
                                          "  LED ring: ${LIGHT_RING_RESTORE_MODE}");
          ESP_LOGCONFIG("${TAG_HW_LEDS}", "Manual LED control (LED ring on): %s",
                                          YESNO(id(leds_manual_override)));

  - id: !extend dump_config_list_packages
    then:
      - script.wait: dump_config
      - lambda: |-
          // Check for requirements
          #ifndef TX_ULTIMATE_EASY_COMMON
            #error "The package TX-Ultimate-Easy-ESPHome_common.yaml is required."
          #endif

          // Identify itself
          ESP_LOGCONFIG(ESPHOME_PROJECT_NAME, "  - Hardware - LEDs");
...
